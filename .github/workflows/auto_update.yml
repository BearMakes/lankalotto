          <script>
          const DATA = """ + json.dumps(lottos, ensure_ascii=False) + """;
          let lang = 'si', curFilter = 'ALL';

          function renderCards() {
            const g = document.getElementById('cardsGrid');
            g.innerHTML = DATA.filter(l => curFilter==='ALL' || l.board===curFilter || (curFilter==='REEL' && l.style==='REEL')).map(l => `
              <div class="bg-slate-900 border border-white/15 rounded-3xl p-5 flex flex-col justify-between shadow-lg">
                <div>
                  <div class="flex justify-between text-xs mb-1">
                    <span class="px-2.5 py-0.5 rounded-full bg-white/10 font-bold text-amber-300">${l.board} • ${l.style}</span>
                    <span class="text-slate-400 font-mono">#${l.drawNo} | ${l.date}</span>
                  </div>
                  <h3 class="text-lg font-extrabold text-white mt-1">${lang==='si'?l.si:l.en}</h3>
                  <div class="flex flex-wrap items-center gap-2 my-3 p-3 bg-slate-950 rounded-2xl border border-white/10">
                    <div class="ball px-3 h-10 rounded-full bg-amber-400 text-slate-950 font-black flex items-center justify-center text-xs">${l.special}</div>
                    ${l.numbers.map(n => l.style==='REEL'
                      ? `<div class="reel px-3 h-10 rounded-xl text-amber-300 font-mono font-black flex items-center justify-center text-sm">${n}</div>`
                      : `<div style="background:${l.col}" class="ball w-10 h-10 rounded-full text-white font-black flex items-center justify-center text-sm">${n}</div>`
                    ).join('')}
                  </div>
                </div>
                <div class="pt-3 border-t border-white/10 space-y-2 text-xs">
                  <div class="flex justify-between"><span class="text-slate-400">මීළඟ ජයමල්ල:</span><b class="text-amber-300">${l.jackpot}</b></div>
                  <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="speakLotto('${l.id}')" class="bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-sky-300 font-bold">🔊 හඬින් අසන්න</button>
                    <button type="button" onclick="shareLotto('${l.id}')" class="bg-emerald-500/20 hover:bg-emerald-500/30 py-2 rounded-xl text-emerald-300 font-bold">📲 WhatsApp</button>
                  </div>
                </div>
              </div>
            `).join('');
          }

          function checkWin() {
            const id = document.getElementById('selLotto').value;
            const raw = document.getElementById('usrNums').value.trim().toUpperCase();
            if (!raw) return alert('කරුණාකර ඔබේ ටිකට් පතේ අංක ඇතුළත් කරන්න!');
            const l = DATA.find(x => x.id === id);
            let tkns = raw.split(/[\\s,-]+/);
            if (l.style === 'REEL' && tkns.length === 2 && tkns[1].length >= 4) tkns = [tkns[0], ...tkns[1].split('')];

            const spMatch = tkns.includes(l.special.toUpperCase());
            const winNums = l.numbers.map(n => n.padStart(2, '0'));
            let m = 0;
            tkns.filter(t => t !== l.special.toUpperCase()).forEach(u => {
              if (winNums.includes(u.padStart(2, '0')) || l.numbers.includes(u)) m++;
            });

            const prize = m>=4&&spMatch?50000000:m>=4?2000000:m===3&&spMatch?200000:m===3?4000:m===2&&spMatch?2000:m===2?200:m===1&&spMatch?200:(m===1||spMatch)?40:0;
            if (prize > 0 && window.confetti) confetti();

            const winSet = [l.special.toUpperCase(), ...winNums, ...l.numbers];
            const out = document.getElementById('winOut');
            out.classList.remove('hidden');
            out.innerHTML = `<div class="flex flex-wrap justify-between items-center gap-3">
              <div class="flex gap-2">${tkns.map(t => `<span class="w-10 h-10 rounded-full flex items-center justify-center font-black text-xs ${winSet.includes(t)\vert{}\vert{}winSet.includes(t.padStart(2,'0'))?'matched':'bg-slate-800 text-slate-400'}">${t}</span>`).join('')}</div>
              <div class="text-lg font-extrabold ${prize>0?'text-emerald-400':'text-rose-400'}">${prize>0?'🎉 සුබ පැතුම්! දිනුම: රු. '+prize.toLocaleString()+'.00':'කණගාටුයි, මෙවර දිනුමක් නැත'}</div>
            </div>`;
          }

          async function scanPhoto(e) {
            const file = e.target.files[0];
            if (!file) return;
            const msg = document.getElementById('ocrMsg');
            msg.classList.remove('hidden');
            try {
              const r = await Tesseract.recognize(URL.createObjectURL(file), 'eng');
              const txt = r.data.text.toUpperCase().replace(/[^A-Z0-9\\s]/g, ' ');
              const tkns = txt.split(/\\s+/).filter(Boolean);
              let ltr = '', nums = [];
              for (const t of tkns) {
                if (/^[A-Z]$/.test(t) && !ltr) ltr = t;
                else if (/^\\d{1,2}$/.test(t) && nums.length < 6) nums.push(t);
              }
              const final = [...(ltr?[ltr]:[]), ...nums];
              if (final.length > 0) {
                document.getElementById('usrNums').value = final.join(' ');
                checkWin();
              } else {
                alert('අංක පැහැදිලිව හඳුනාගත නොහැකි විය. අංක පෙළට ළඟින් ෆොටෝ එකක් ගන්න.');
              }
            } catch (err) {
              alert('ඡායාරූපය කියවීමේ දෝෂයක්.');
            } finally {
              msg.classList.add('hidden');
            }
          }

