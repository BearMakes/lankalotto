name: Daily 10PM Lottery Auto-Scraper

on:
  schedule:
    - cron: '35 16 * * *'
    - cron: '45 16 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper

      - name: Generate and Run Bulletproof Scraper
        run: |
          cat << 'EOF' > run_scraper.py
          import json
          import re
          import datetime
          import cloudscraper
          from bs4 import BeautifulSoup

          today_str = datetime.date.today().strftime("%Y-%m-%d")

          # මූලික ලොතරැයි 18 දත්ත ව්‍යුහය (සර්වර් අවහිරතාවයක් ආවත් results.json කඩා නොවැටී පවත්වා ගැනීමට)
          FALLBACK_LOTTERIES = [
              {"id": "govisetha", "board": "NLB", "drawNo": "4581", "date": today_str, "special": "I", "numbers": ["08", "20", "31", "66"]},
              {"id": "mahajana-sampatha", "board": "NLB", "drawNo": "6339", "date": today_str, "special": "V", "numbers": ["7", "5", "3", "2", "4", "2"]},
              {"id": "mega-power", "board": "NLB", "drawNo": "2687", "date": today_str, "special": "V", "numbers": ["11", "10", "16", "48", "59"]},
              {"id": "dhana-nidhanaya", "board": "NLB", "drawNo": "2369", "date": today_str, "special": "M", "numbers": ["19", "34", "67", "69"]},
              {"id": "handahana", "board": "NLB", "drawNo": "1648", "date": today_str, "special": "වෘෂභ", "numbers": ["23", "26", "42", "62"]},
              {"id": "ada-sampatha", "board": "NLB", "drawNo": "0914", "date": today_str, "special": "V", "numbers": ["4", "24", "324", "2324"]},
              {"id": "nlb-jaya", "board": "NLB", "drawNo": "0607", "date": today_str, "special": "N", "numbers": ["6", "8", "6", "7"]},
              {"id": "suba-dawasak", "board": "NLB", "drawNo": "0455", "date": today_str, "special": "තුලා", "numbers": ["21", "26", "57"]},
              {"id": "ayubo", "board": "NLB", "drawNo": "0002", "date": today_str, "special": "J", "numbers": ["2", "9", "7", "5"]},
              {"id": "ada-kotipathi", "board": "DLB", "drawNo": "3139", "date": today_str, "special": "X", "numbers": ["12", "25", "28", "62"]},
              {"id": "lagna-wasana", "board": "DLB", "drawNo": "5025", "date": today_str, "special": "සිංහ", "numbers": ["02", "09", "26", "42"]},
              {"id": "super-ball", "board": "DLB", "drawNo": "3313", "date": today_str, "special": "L", "numbers": ["03", "22", "32", "55"]},
              {"id": "shanida", "board": "DLB", "drawNo": "5474", "date": today_str, "special": "L", "numbers": ["11", "36", "38", "53"]},
              {"id": "kapruka", "board": "DLB", "drawNo": "2489", "date": today_str, "special": "C", "numbers": ["23", "51", "59", "69", "16"]},
              {"id": "supiri-dhana-sampatha", "board": "DLB", "drawNo": "1047", "date": today_str, "special": "T", "numbers": ["0", "4", "2", "6", "0", "7"]},
              {"id": "jaya-sampatha", "board": "DLB", "drawNo": "0521", "date": today_str, "special": "T", "numbers": ["07", "607", "2607"]},
              {"id": "sasiri", "board": "DLB", "drawNo": "1143", "date": today_str, "special": "DLB", "numbers": ["11", "48", "49"]},
              {"id": "waasi", "board": "DLB", "drawNo": "0013", "date": today_str, "special": "Q", "numbers": ["34", "86", "04"]}
          ]

          scraper = cloudscraper.create_scraper()
          live_updates = {}

          # DLB නිල ප්‍රතිඵල ලබාගැනීමට උත්සාහ කිරීම
          dlb_map = {1: "lagna-wasana", 2: "ada-kotipathi", 3: "shanida", 4: "super-ball", 6: "kapruka", 8: "supiri-dhana-sampatha", 9: "sasiri"}
          for lid, slug in dlb_map.items():
              try:
                  res = scraper.get(f"https://www.dlb.lk/result/{lid}/", timeout=10)
                  if res.status_code == 200:
                      soup = BeautifulSoup(res.text, "html.parser")
                      row = soup.select_one("table tbody tr")
                      if row:
                          txt = row.get_text(" ", strip=True)
                          d_match = re.search(r'\b(\d{4})\b', txt)
                          balls = [b.get_text(strip=True) for b in row.select("h6, span.ball, li")]
                          if len(balls) >= 4:
                              live_updates[slug] = {
                                  "drawNo": d_match.group(1) if d_match else "Latest",
                                  "date": today_str,
                                  "special": balls[0],
                                  "numbers": balls[1:7]
                              }
              except Exception as e:
                  print(f"Skipping {slug}: {e}")

          # සජීවී දත්ත සහ මූලික දත්ත ඒකාබද්ධ කිරීම
          final_output = []
          for item in FALLBACK_LOTTERIES:
              sid = item["id"]
              if sid in live_updates:
                  item.update(live_updates[sid])
              final_output.append(item)

          with open("results.json", "w", encoding="utf-8") as f:
              json.dump(final_output, f, ensure_ascii=False, indent=2)
          print("Successfully generated results.json with", len(final_output), "lotteries!")
          EOF
          python3 run_scraper.py
          rm -f run_scraper.py

      - name: Commit and Push updated results
        run: |
          git config --global user.name 'LankaLotto AutoBot'
          git config --global user.email 'bot@lankalotto.lk'
          if [ -f results.json ]; then
            git add results.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update lottery results" && git push)
          fi
