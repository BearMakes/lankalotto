              </div>
              <div class="bg-slate-950 p-4 rounded-2xl border border-white/10 space-y-2">
                <div class="font-bold text-white">🤝 හවුල් ටිකට් බදු (14%) සහ කොටස් ගණකය</div>
                <div class="flex gap-2">
                  <input type="number" id="pMem" value="4" oninput="calcPool()" class="w-16 bg-slate-900 border border-white/15 rounded-lg p-2 text-white">
                  <input type="number" id="pAmt" value="50000000" oninput="calcPool()" class="flex-1 bg-slate-900 border border-white/15 rounded-lg p-2 text-white">
