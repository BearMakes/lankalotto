                  <option value="N - 09 - 18 - 36 - 63">🐍 නාගයෙක් දැකීම</option>
                  <option value="W - 04 - 12 - 28 - 56">🌊 ජලය / දිය ඇල්ලක්</option>
                  <option value="K - 01 - 10 - 49 - 69">👑 රත්තරන් / මුදල්</option>
                </select>
